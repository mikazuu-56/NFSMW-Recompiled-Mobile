name: NFSMW Android Cool Mode

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager tidak ditemukan"
            exit 1
          fi

          SDK_BIN=$(dirname "$SDKMANAGER")

          echo "$SDK_BIN" >> "$GITHUB_PATH"
          export PATH="$SDK_BIN:$PATH"

          sdkmanager --version

      - name: Install Android dependencies
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Fetch ReXGlue dependencies
        working-directory: nativo
        shell: bash
        run: |
          set -e
          python3 tools/fetch_thirdparty.py

          echo "===== VERIFY SDL3 ====="
          test -f sdk/thirdparty/sdl3/android-project/app/src/main/java/org/libsdl/app/SDLActivity.java

          echo "===== VERIFY VULKAN ====="
          test -d sdk/thirdparty/vulkan-headers/include

          echo "Dependencies ready"

      - name: Build Android APK
        working-directory: nativo/android
        run: bash ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NFSMW-POCO-X3-Cool-Mode
          path: nativo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
